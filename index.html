<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넷플릭스 클론 페이지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/profile.css">
    <link rel="stylesheet" href="styles/hero.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <script src="scripts.js"></script>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="/">
            <img src="assets/Netflix_Logo.png" width="100" alt="Netflix Logo" class="logo-image">
            </a>
        </div>
        <nav class="nav">
            <ul>
                <a href="#">홈</a>
                <a href="#">시리즈</a>
                <a href="#">영화</a>
                <a href="#">게임</a>
                <a href="#">NEW! 요즘 대세 컨텐츠</a>
                <a href="#">내가 찜한 리스트</a>
                <a href="#">언어별로 찾아보기</a>
            </ul>
        </nav>
        <div class="user-menu">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bell"></i>
            <div class="profile" role="button" aria-haspopup="true" aria-expanded="false">
                <img src="assets/profile.png" alt="Profile">
                <i class="fa-solid fa-caret-down caret" aria-hidden="true"></i>
                <div class="dropdown" role="menu">
                    <a href="#" role="menuitem">계정</a>
                    <a href="#" role="menuitem">고객센터</a>
                    <a href="#" role="menuitem">로그아웃</a> 
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="hero-container">
            <img src="assets/hero-image.png" alt="Hero Image" class="hero-image">
            <div class="hero-content">
                <img src="assets/hero-title.png" alt="Hero Title" class="hero-title">
                <p class="hero-description">시간을 거슬러 과거로 가게 된 현대의 셰프가 폭군으로 악명 높은 왕을 만난다. 그녀는 탁월한 요리 솜씨로 왕의 마음과 입맛을 모두 사로잡을 수 있을까?</p>
                <div class="hero-buttons">
                    <button class="play-button">
                        <i class="fa-solid fa-play"></i> 재생
                    </button>
                    <button class="info-button">
                        <i class="fa-solid fa-circle-info"></i> 상세 정보
                    </button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
