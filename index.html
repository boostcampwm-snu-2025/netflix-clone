<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200" />
    <!-- 고정 너비 -->
    <title>Netflix UI Clone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 헤더 -->
    <header class="header">
      <div class="container header__inner">
        <h1 class="logo"><a href="#">NETFLIX</a></h1>
        <nav class="nav">
          <ul class="nav__list">
            <li><a href="#">홈</a></li>
            <li><a href="#">시리즈</a></li>
            <li><a href="#">영화</a></li>
            <li><a href="#">NEW & 요즘 대세 콘텐츠</a></li>
            <li><a href="#">내가 찜한 리스트</a></li>
            <li><a href="#">연도별로 찾아보기</a></li>
          </ul>
        </nav>
        <div class="header__actions">
          <!-- 검색 -->
          <span>🔍</span>
          <!-- 알림 -->
          <span>🔔</span>
          <!-- 프로필-->
          <img class="profile" src="./src/profile.png" alt="프로필" />
        </div>
      </div>
    </header>
    <main class="main">
      <!-- hero: 상단의 대표 섹션 -->
      <section class="hero">
        <!-- overlay: 배경 이미지 위를 살짝 어둡게 덮음 (가독성 높임) -->
        <div class="hero__overlay"></div>
        <div class="container">
          <div class="hero__content">
            <h2 id="hero-title" class="hero__title">폭군의 셰프</h2>
            <p class="hero__desc">
              시간과 국경을 초월한 가업, 한식의 셰프가 두고 온 아련한 맛의 향연.
            </p>
            <div class="hero__buttons">
              <button class="btn btn--primary">▶ 재생</button>
              <button class="btn btn--secondary">ℹ 상세 정보</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
