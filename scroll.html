<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Style Peek Slider</title>
  <style>
    :root {
      --card-size: 16.666%;
    }

    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h2 {
      margin: 1rem;
    }

    .sliderWrapper {
      position: relative;
      width: 100%;
    }

    .sliderMask {
      width: 100%;
      overflow: hidden;
      position: relative;
      padding: 0 calc(var(--card-size) / 2); /* peek of prev/next */
      box-sizing: border-box;
    }

    .sliderContent {
      display: flex;
      transition: transform 0.6s ease;
    }

    .slider-item {
      flex: 0 0 var(--card-size);
      box-sizing: border-box;
      aspect-ratio: 2/3;
      padding: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      position: relative;
    }

    .slider-item .no {
      width: 100%;
      height: 100%;
      background: #444; /* base color */
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
      font-weight: bold;
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .slider-item .no:hover {
      background: linear-gradient(135deg, #555, #777); /* hover color */
      transform: scale(1.15) translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7),
                  0 0 8px rgba(255, 255, 255, 0.3);
      border-radius: 12px; /* stays rounded even when zoomed */
      z-index: 10;
      position: relative;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      font-size: 2rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      z-index: 5;
      border-radius: 4px;
    }

    .slider-btn:hover {
      background: rgba(0,0,0,0.8);
    }

    .prev { left: 0.5rem; }
    .next { right: 0.5rem; }
  </style>
</head>
<body>
  <h2>Netflix-Style Peek Slider</h2>

  <div class="sliderWrapper">
    <button class="slider-btn prev">&#10094;</button>
    <div class="sliderMask">
      <div class="sliderContent" id="sliderContent"></div>
    </div>
    <button class="slider-btn next">&#10095;</button>
  </div>

  <script>
    const sliderContent = document.getElementById("sliderContent");
    const prevBtn = document.querySelector(".prev");
    const nextBtn = document.querySelector(".next");

    const totalItems = 18;
    const itemsPerPage = 6;
    let startIndex = 0;
    let isAnimating = false;

    function getShift(multiplier) {
      const cardSize = parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue("--card-size"));
      return -(cardSize * itemsPerPage * multiplier);
    }

    function renderWindow() {
      sliderContent.innerHTML = "";

      for (let offset = -itemsPerPage; offset < itemsPerPage * 2; offset++) {
        const index = (startIndex + offset + totalItems) % totalItems;
        const item = document.createElement("div");
        item.className = "slider-item";
        item.innerHTML = `<div class="no">${index + 1}</div>`;
        sliderContent.appendChild(item);
      }

      // Center on middle 6, with peek
      sliderContent.style.transition = "none";
      sliderContent.style.transform = `translateX(${getShift(1)}%)`;
      void sliderContent.offsetWidth;
      sliderContent.style.transition = "transform 0.6s ease";
    }

    function slideNext() {
      if (isAnimating) return;
      isAnimating = true;
      sliderContent.style.transform = `translateX(${getShift(2)}%)`;

      sliderContent.addEventListener("transitionend", function handler() {
        sliderContent.removeEventListener("transitionend", handler);
        startIndex = (startIndex + itemsPerPage) % totalItems;
        renderWindow();
        isAnimating = false;
      });
    }

    function slidePrev() {
      if (isAnimating) return;
      isAnimating = true;
      sliderContent.style.transform = `translateX(${getShift(0)}%)`;

      sliderContent.addEventListener("transitionend", function handler() {
        sliderContent.removeEventListener("transitionend", handler);
        startIndex = (startIndex - itemsPerPage + totalItems) % totalItems;
        renderWindow();
        isAnimating = false;
      });
    }

    nextBtn.addEventListener("click", slideNext);
    prevBtn.addEventListener("click", slidePrev);

    renderWindow();
  </script>
</body>
</html>
