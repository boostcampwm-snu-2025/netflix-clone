<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Style Peek Slider</title>
    <style>
        :root {
            --card-size: 16.666%;
            /* 6 per view */
        }

        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h2 {
            margin: 1rem;
        }

        .sliderWrapper {
            position: relative;
            width: 100%;
        }

        .sliderMask {
            width: 100%;
            overflow: hidden;
            position: relative;
            padding: 0 calc(var(--card-size) / 2);
            box-sizing: border-box;
        }

        .sliderContent {
            display: flex;
            transition: transform 0.6s ease;
        }

        .slider-item {
            flex: 0 0 var(--card-size);
            box-sizing: border-box;
            aspect-ratio: 2/3;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            position: relative;
        }

        .slider-item .no {
            width: 100%;
            height: 100%;
            background: #444;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: currentColor;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        .slider-item .no:hover {
            background: linear-gradient(135deg, #555, #777);
            transform: scale(1.15) translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7),
                0 0 8px rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            z-index: 10;
            position: relative;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            font-size: 2rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            z-index: 5;
            border-radius: 4px;
        }

        .slider-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .prev {
            left: 0.5rem;
        }

        .next {
            right: 0.5rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <h2>Netflix-Style Peek Slider</h2>

    <div class="sliderWrapper">
        <button class="slider-btn prev hidden">&#10094;</button>
        <div class="sliderMask">
            <div class="sliderContent" id="sliderContent"></div>
        </div>
        <button class="slider-btn next">&#10095;</button>
    </div>

    <script>
        const sliderContent = document.getElementById("sliderContent");
        const prevBtn = document.querySelector(".prev");
        const nextBtn = document.querySelector(".next");

        const totalItems = 18;
        const itemsPerPage = 6;
        const clones = itemsPerPage + 1; // <-- num_card_view + 1
        let currentIndex = clones; // start after front clones
        let isAnimating = false;
        let hasClicked = false;

        function createSlider() {
            sliderContent.innerHTML = "";

            // clone last (num_card_view + 1) at start
            for (let i = totalItems - clones; i < totalItems; i++) {
                sliderContent.appendChild(createItem(i));
            }

            // main items
            for (let i = 0; i < totalItems; i++) {
                sliderContent.appendChild(createItem(i));
            }

            // clone first (num_card_view + 1) at end
            for (let i = 0; i < clones; i++) {
                sliderContent.appendChild(createItem(i));
            }

            updateTransform();
        }

        function createItem(index) {
            const item = document.createElement("div");
            item.className = "slider-item";
            item.innerHTML = `<div class="no">${index + 1}</div>`;
            return item;
        }

        function updateTransform(animate = false) {
            sliderContent.style.transition = animate ? "transform 0.6s ease" : "none";
            sliderContent.style.transform = `translateX(-${currentIndex * (100 / (itemsPerPage + 0))}%)`;
        }

        function slideNext() {
            if (isAnimating) return;
            isAnimating = true;
            hasClicked = true;
            prevBtn.classList.remove("hidden");

            currentIndex += itemsPerPage;
            updateTransform(true);

            sliderContent.addEventListener("transitionend", function handler() {
                sliderContent.removeEventListener("transitionend", handler);
                if (currentIndex >= totalItems + clones) {
                    // wrap back to first real
                    currentIndex = clones;
                    updateTransform(false);
                }
                isAnimating = false;
            });
        }

        function slidePrev() {
            if (!hasClicked) return;
            if (isAnimating) return;
            isAnimating = true;

            currentIndex -= itemsPerPage;
            updateTransform(true);

            sliderContent.addEventListener("transitionend", function handler() {
                sliderContent.removeEventListener("transitionend", handler);
                if (currentIndex < clones) {
                    currentIndex = totalItems + clones - itemsPerPage;
                    updateTransform(false);
                }
                isAnimating = false;
            });
        }

        nextBtn.addEventListener("click", slideNext);
        prevBtn.addEventListener("click", slidePrev);

        createSlider();
    </script>
</body>

</html>
